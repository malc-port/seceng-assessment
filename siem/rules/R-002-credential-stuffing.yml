id: R-002
title: Credential stuffing against the login endpoint
status: production
author: security@coinflow.cash
created: 2026-02-02
last_modified: 2026-02-02
severity: high
description: >
  Detects password guessing by counting authentication failures originating
  from a single source address.

source: coinflow-auth

detection:
  where:
    - event == "login_failure"
  group_by: src_ip
  threshold:
    count: 10
    window: 5m

response:
  destination: slack#sec-alerts
  runbook: https://runbooks.coinflow.internal/sec/R-002
